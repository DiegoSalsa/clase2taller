name: CI manual clase2taller

# El servidor UBB realiza el CI/CD automático mediante polling desde main.
# Este workflow queda disponible como validación manual adicional. Los runners
# hospedados de GitHub no forman parte del camino crítico de producción.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Ejecutar ESLint
        working-directory: backend
        run: npm run lint
