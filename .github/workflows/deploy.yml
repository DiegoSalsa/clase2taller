name: CI/CD clase2taller

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clase2taller-production
  cancel-in-progress: true

jobs:
  validate-and-promote:
    name: Validar y promover a production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Ejecutar ESLint
        working-directory: backend
        run: npm run lint

      - name: Promover commit validado a production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${GITHUB_SHA}:refs/heads/production" --force

      - name: Resumen
        run: |
          {
            echo "## CI/CD completado"
            echo
            echo "Commit validado: \`${GITHUB_SHA}\`"
            echo "Rama \`production\` actualizada."
            echo "El servidor UBB consulta cambios cada 2 minutos y desplegará este commit automáticamente."
          } >> "$GITHUB_STEP_SUMMARY"
