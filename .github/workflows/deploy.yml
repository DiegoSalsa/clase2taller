name: CI/CD clase2taller

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clase2taller-production
  cancel-in-progress: true

jobs:
  validate-and-promote:
    name: Validar y promover a production
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$GITHUB_SHA"

      - name: Mostrar entorno
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        working-directory: repo/backend
        run: npm ci

      - name: Ejecutar ESLint
        working-directory: repo/backend
        run: npm run lint

      - name: Promover commit validado a production
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${GITHUB_SHA}:refs/heads/production" --force

      - name: Resumen
        run: |
          {
            echo "## CI/CD completado"
            echo
            echo "Commit validado: \`${GITHUB_SHA}\`"
            echo "Rama \`production\` actualizada."
            echo "El servidor UBB consulta cambios cada 2 minutos y desplegará este commit automáticamente."
          } >> "$GITHUB_STEP_SUMMARY"
